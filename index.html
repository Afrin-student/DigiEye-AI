<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiEye - Handwritten Digit Recognition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>👁️ DigiEye</h1>

        <p class="subtitle">
            Handwritten Digit Recognition System
        </p>

        <div class="card">

            <h2>Draw a Digit</h2>

            <canvas id="canvas" width="280" height="280"></canvas>
            <input
    type="file"
    id="imageUpload"
    accept="image/*">

            <div class="buttons">
                <button onclick="predictDigit()">Predict</button>
                <button onclick="clearCanvas()">Clear</button>
            </div>
<div class="result">
    <h3>Prediction:</h3>

    <p id="prediction">
        Draw a digit and click Predict
    </p>

    <p id="confidence">
        Confidence: --
    </p>
</div>
            <div class="history">
    <h3>Prediction History</h3>
    <ul id="historyList"></ul>
</div>

<div class="analytics">
    <h3>Analytics</h3>

    <p>
        Total Predictions:
        <span id="totalPredictions">0</span>
    </p>

    <p>
        Last Prediction:
        <span id="lastPrediction">--</span>
    </p>
    <p>
    Most Predicted Digit:
    <span id="mostPredicted">--</span>
</p>
</div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
